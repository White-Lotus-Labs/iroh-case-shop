[workspace]
members = ["economics", "usdi", "case-pool", "mock-token"]
resolver = "2"
exclude = ["integration"]

[workspace.dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy"] }
near-contract-standards = "=5.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
iroh-economics = { path = "economics" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
