[package]
name = "iroh-sandbox-integration"
version = "0.1.0"
edition = "2024"
publish = false

# The maintained SDK and current workspaces runner depend on incompatible
# aws-lc native-library versions. Resolve this local runner independently.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
near-workspaces = { version = "=0.24.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
